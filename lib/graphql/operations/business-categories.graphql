# Business Categories Operations

query FindAllBusinessCategories(
  $skip: Int
  $take: Int
  $q: String
  $where: String
  $orderBy: String
) {
  findAllBusinessCategories(
    skip: $skip
    take: $take
    q: $q
    where: $where
    orderBy: $orderBy
  ) {
    data {
      id
      name
      code
      information
      isActive
      createdAt
      updatedAt
    }
    meta {
      total
      page
      limit
    }
  }
}

query FindOneBusinessCategory($id: Int!) {
  findOneBusinessCategory(id: $id) {
    id
    name
    code
    information
    isActive
    createdAt
    updatedAt
  }
}

