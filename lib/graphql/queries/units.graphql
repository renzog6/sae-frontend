# Units GraphQL Queries and Mutations

query FindAllUnits(
  $skip: Int! = 0
  $take: Int! = 10
  $orderBy: String
  $q: String
  $where: String
) {
  findAllUnits(
    skip: $skip
    take: $take
    orderBy: $orderBy
    q: $q
    where: $where
  ) {
    data {
      id
      name
      abbreviation
      isActive
    }
    meta {
      total
      page
      limit
    }
  }
}

query FindOneUnit($id: Int!) {
  findOneUnit(id: $id) {
    id
    name
    abbreviation
    isActive
  }
}

mutation CreateUnit($input: CreateUnitDto!) {
  createUnit(input: $input) {
    id
    name
    abbreviation
  }
}

mutation UpdateUnit($id: Int!, $input: UpdateUnitDto!) {
  updateUnit(id: $id, input: $input) {
    id
    name
    abbreviation
  }
}

mutation RemoveUnit($id: Int!) {
  removeUnit(id: $id) {
    id
  }
}

mutation RestoreUnit($id: Int!) {
  restoreUnit(id: $id) {
    id
  }
}

mutation HardDeleteUnit($id: Int!) {
  hardDeleteUnit(id: $id) {
    id
  }
}
