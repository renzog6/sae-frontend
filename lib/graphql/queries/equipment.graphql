mutation RemoveEquipment($id: Int!) {
  removeEquipment(id: $id) {
    id
  }
}

mutation RestoreEquipment($id: Int!) {
  restoreEquipment(id: $id) {
    id
  }
}

mutation HardDeleteEquipment($id: Int!) {
  hardDeleteEquipment(id: $id) {
    id
  }
}
