# Equipment GraphQL Queries

query FindAllEquipment(
  $skip: Int! = 0
  $take: Int! = 10
  $orderBy: String
  $q: String
  $where: String
  $filter: EquipmentFilterInput
) {
  findAllEquipment(
    skip: $skip
    take: $take
    orderBy: $orderBy
    q: $q
    where: $where
    filter: $filter
  ) {
    data {
      id
      name
      internalCode
      licensePlate
      status
      year
      type {
        id
        name
      }
      model {
        id
        name
        brand {
          id
          name
        }
      }
      category {
        id
        name
      }
    }
    meta {
      total
      page
      limit
    }
  }
}

query FindOneEquipment($id: Int!) {
  findOneEquipment(id: $id) {
    id
    name
    internalCode
    licensePlate
    chassis
    engine
    color
    year
    status
    observation
    description
    typeId
    modelId
    categoryId
    companyId
    type {
      id
      name
    }
    model {
      id
      name
      brand {
        id
        name
      }
    }
    category {
      id
      name
    }
    company {
      id
      name
    }
    axles {
      id
      axleType
      order
      wheelCount
      tirePositions {
        id
        positionKey
        side
        isDual
      }
    }
  }
}

